# Fixed-length 50 Hz air-hockey data for the SA world model.
#
# 1,000 games x 1,000 transitions = 1,000,000 transitions before any
# converter min-length filtering. The source game counts enforce a 50/50
# aggressive/random mixture. Re-running resumes only incomplete target totals
# with fresh seeds and rebuilds the H5 root from completed raw games.
version: 1

dataset:
  raw_dir: /home_shared/grail_charles/data/raw_2023_puck100_mallet100_arm15_v6_1m
  h5_dir: /home_shared/grail_charles/data/airhockey_sa_h5_puck100_mallet100_arm15_v6_1m

collection:
  conda_env: airhockey2023
  platform: cpu
  steps: 1000
  width: 128
  height: 128
  fps: 50
  puck_radius: 0.10
  mallet_radius: 0.10
  robot_visual_scale: 1.5
  # Keys here map directly to collect_2023.py flags. Fixed-length mode hides
  # only a scored puck; edge and stuck pucks remain visible.
  collector_args:
    episode_mode: fixed_length
    # Absolute metre dimensions: they do not grow with puck_radius.
    orientation_marker_arm_length: 0.08
    orientation_marker_stroke_width: 0.024
    # Inclusive, randomly sampled 50 Hz pause duration: 1--5 seconds.
    idle_min_steps: 50
    idle_max_steps: 250
    # Both players switch to smooth_random after the first real goal.
    post_goal_policy: smooth_random
    # Force both passive mallets level and at the policy's table height.
    mallet_level_lock: hard_level_height_projection

sources:
  - name: aggressive
    model1: tournament_aggressive
    model2: tournament_aggressive
    games: 500
    workers: 12
    seed_base: 0
    collector_args:
      # Independent per-unpaused-step pause onset probability (~one per 4 s).
      idle_prob1: 0.005
      idle_prob2: 0.005
  - name: random
    model1: smooth_random
    model2: smooth_random
    games: 500
    workers: 12
    seed_base: 100000
    collector_args:
      idle_prob1: 0.005
      idle_prob2: 0.005

mixture:
  fractions:
    aggressive: 0.50
    random: 0.50

conversion:
  img_size: 128
  shard_size: 256
  val_frac: 0.05
  min_len: 20
  procs: 16
  overwrite: true
